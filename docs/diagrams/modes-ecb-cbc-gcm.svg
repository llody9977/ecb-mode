528 120, 528 168, 500 168" fill="none" stroke="#dc2626" stroke-width="1.6"/><text x="548" y="148.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="548" dy="0">identical</tspan></text><text x="548" y="164.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle" font-weight="400"><tspan x="548" dy="0">in → identical out</tspan></text><rect x="24" y="224" width="852" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="40" y="248" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">AES-CBC  —  each block is XORed with the previous ciphertext (random IV)</tspan></text><rect x="44" y="264" width="84" height="26" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="86.0" y="280.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan x="86.0" dy="0">random IV</tspan></text><rect x="44" y="306" width="74" height="26" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="81.0" y="322.6666666666667" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan x="81.0" dy="0">P1</tspan></text><line x1="128" y1="277" x2="169" y2="306" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><line x1="118" y1="319" x2="169" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><circle cx="184" cy="312" r="15" fill="#fff" stroke="#475569" stroke-width="1.8"/><text x="184" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#475569" text-anchor="middle" font-weight="700"><tspan x="184" dy="0">⊕</tspan></text><line x1="199" y1="312" x2="236" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><rect x="236" y="296" width="58" height="32" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="265.0" y="316.6666666666667" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0">Eₖ</tspan></text><line x1="294" y1="312" x2="330" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><rect x="330" y="296" width="74" height="32" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="367.0" y="316.3333333333333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan x="367.0" dy="0">C1</tspan></text><rect x="470" y="264" width="84" height="26" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="512.0" y="280.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan x="512.0" dy="0">P2 = P1</tspan></text><circle cx="560" cy="312" r="15" fill="#fff" stroke="#475569" stroke-width="1.8"/><text x="560" y="317" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#475569" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">⊕</tspan></text><line x1="544" y1="277" x2="560" y2="297" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><path d="M 404 312 C 430 312, 430 350, 545 350 L 545 324 L 552 324" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arw)"/><rect x="406.48" y="353" width="127.04" height="17" rx="4" fill="#ffffff" opacity="0.95"/><text x="470" y="365" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="500"><tspan x="470" dy="0">previous ciphertext</tspan></text><line x1="575" y1="312" x2="612" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><rect x="612" y="296" width="58" height="32" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="641.0" y="316.6666666666667" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3730a3" text-anchor="middle" font-weight="700"><tspan x="641.0" dy="0">Eₖ</tspan></text><line x1="670" y1="312" x2="706" y2="312" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><rect x="706" y="296" width="150" height="32" rx="9" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/><text x="781.0" y="316.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="781.0" dy="0">C2 ≠ C1  — no leak</tspan></text><rect x="24" y="386" width="852" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="40" y="410" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">AES-GCM  —  encrypt a per-message nonce+counter, XOR into the plaintext, then authenticate</tspan></text><rect x="44" y="462" width="120" height="32" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="104.0" y="481.6666666666667" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weig