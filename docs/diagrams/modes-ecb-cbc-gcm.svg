nchor="middle" font-weight="600"><tspan x="545.0" dy="0">C1  +  auth tag</tspan></text><text x="680" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"><tspan x="680" dy="0">nonce per message →</tspan></text><text x="680" y="490" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="start" font-weight="400"><tspan x="680" dy="0">no repeats; tag detects tampering</tspan></text></svg>