<svg xmlns="http://www.w3.org/2000/svg" width="900" height="552" viewBox="0 0 900 552" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="898" height="550" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Why only ECB leaks structure</tspan></text><text x="450.0" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">same plaintext blocks under the same key — only ECB maps them to the same ciphertext</tspan></text><rect x="24" y="62" width="852" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="40" y="86" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700"><tspan x="40" dy="0">AES-ECB  —  the plaintext block is the only input</tspan></text><rect x="48" y="104" width="74" height="32" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="85.0" y="124.33333333333333" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="600"><tspan x="85.0" dy="0">P1</tspan></text><line x1="122" y1="120" x2="168" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><rect x="168" y="104" width="58" height="32" rx="7" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="197.