<svg xmlns="http://www.w3.org/2000/svg" width="900" height="388" viewBox="0 0 900 388" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><style>:root{--card:#ffffff;--panel:#f8fafc;--border:#e2e8f0;--ink:#0f172a;--muted:#475569;--neuf:#f1f5f9;--neus:#cbd5e1;--arw:#94a3b8}@media (prefers-color-scheme:dark){:root{--card:#0d1117;--panel:#161b22;--border:#30363d;--ink:#e6edf3;--muted:#9aa4b2;--neuf:#1c2330;--neus:#3d444d;--arw:#6e7681}}.cardb{fill:var(--card);stroke:var(--border)}.card{fill:var(--card)}.panel{fill:var(--panel);stroke:var(--border)}.neu{fill:var(--neuf);stroke:var(--neus)}.cellA{fill:var(--neuf);stroke:var(--neus)}.xor{fill:var(--card);stroke:var(--muted)}.ink{fill:var(--ink)}.muted{fill:var(--muted)}.arw{stroke:var(--arw)}.arwhead{fill:var(--arw)}</style><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" class="arwhead"/></marker></defs><rect class="cardb" x="1" y="1" width="898" height="386" rx="14" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" class="ink" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">ECB's two root causes and four attack vectors</tspan></text><text x="450.0" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">every vector follows from one or both root causes — there is no third</tspan></text><rect x="370.0" y="62" width="160" height="44" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="450.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">AES-ECB</tspan></text><rect x="70" y="150" width="340" height="68" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="240.0" y="173.16666666666666" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">Root cause 1 — Determinism</tspan><tspan x="240.0" dy="15">same plaintext block → same ciphertext block,</tspan><tspan x="240.0" dy="15">at any position, in any message</tspan></text><rect x="490" y="150" width="340" height="68" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="660.0" y="173.16666666666666" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="660.0" dy="0">Root cause 2 — No authentication</tspan><tspan x="660.0" dy="15">nothing detects a ciphertext that was</tspan><tspan x="660.0" dy="15">altered or reassembled</tspan></text><line x1="450.0" y1="106" x2="240.0" y2="148" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="106" x2="660.0" y2="148" class="arw" stroke-width="2" marker-end="url(#arw)"/><rect class="neu" x="30" y="268" width="190" height="66" rx="9" stroke-width="1.5"/><rect x="30" y="268" width="6" height="66" rx="3" fill="#2563eb"/><text x="125.0" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0">Vector 1</tspan></text><text x="125.0" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="125.0" dy="0">Pattern &amp; structure leakage</tspan></text><text x="125.0" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" class="muted" text-anchor="middle" font-weight="500"><tspan x="125.0" dy="0">passive</tspan></text><rect class="neu" x="232" y="268" width="190" height="66" rx="9" stroke-width="1.5"/><rect x="232" y="268" width="6" height="66" rx="3" fill="#2563eb"/><text x="327.0" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="327.0" dy="0">Vector 2</tspan></text><text x="327.0" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="327.0" dy="0">Equality &amp; frequency inference</tspan></text><text x="327.0" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" class="muted" text-anchor="middle" font-weight="500"><tspan x="327.0" dy="0">passive / statistical</tspan></text><rect class="neu" x="434" y="268" width="180" height="66" rx="9" stroke-width="1.5"/><rect x="434" y="268" width="6" height="66" rx="3" fill="#2563eb"/><text x="524.0" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="524.0" dy="0">Vector 3</tspan></text><text x="524.0" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="524.0" dy="0">Byte-at-a-time recovery</tspan></text><text x="524.0" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" class="muted" text-anchor="middle" font-weight="500"><tspan x="524.0" dy="0">active oracle</tspan></text><rect class="neu" x="640" y="268" width="230" height="66" rx="9" stroke-width="1.5"/><rect x="640" y="268" width="6" height="66" rx="3" fill="#b45309"/><text x="755.0" y="290" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" class="ink" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0">Vector 4</tspan></text><text x="755.0" y="308" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" class="ink" text-anchor="middle" font-weight="400"><tspan x="755.0" dy="0">Block malleability / cut-and-paste</tspan></text><text x="755.0" y="324" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" class="muted" text-anchor="middle" font-weight="500"><tspan x="755.0" dy="0">active splice</tspan></text><line x1="240.0" y1="218" x2="125.0" y2="266" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="240.0" y1="218" x2="327.0" y2="266" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="240.0" y1="218" x2="524.0" y2="266" class="arw" stroke-width="2" marker-end="url(#arw)"/><line x1="660.0" y1="218" x2="755.0" y2="266" class="arw" stroke-width="2" marker-end="url(#arw)"/><path d="M 240.0 218 C 240.0 252, 635.0 238, 729.0 266" fill="none" class="arw" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arw)"/><rect class="card" x="440.1" y="233" width="194.8" height="17" rx="4" opacity="0.95"/><text x="537.5" y="245" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" class="muted" text-anchor="middle" font-weight="500"><tspan x="537.5" dy="0">Vector 4 needs determinism too</tspan></text><text x="450.0" y="372" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" class="muted" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">Scope: educational analysis of ECB's failure modes; every vector here is demonstrated only against the local in-page oracle in this project.</tspan></text></svg>
