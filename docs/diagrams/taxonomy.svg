<svg xmlns="http://www.w3.org/2000/svg" width="900" height="348" viewBox="0 0 900 348" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="898" height="346" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/><text x="450.0" y="32" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">ECB's two root causes and four attack vectors</tspan></text><text x="450.0" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="400"><tspan x="450.0" dy="0">every vector follows from one or both root causes — there is no third</tspan></text><rect x="370.0" y="62" width="160" height="44" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="450.0" y="89.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">AES-ECB</tspan></text><rect x="90" y="150" width="320" height="58" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="250.0" y="175.66666666666666" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="250.0" dy="0">Root cause 1 — Determinism</tspan><tspan x="250.0" dy="15">equal plaintext block → equal ciphertext block</tspan></text><rect x="490" y="150" width="320" height="58" rx="9" fill="#1f3a5f" stroke="#0d1b2a" stroke-width="1.5"/><text x="650.0" y="175.66666666666666" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="600"><tspan x="650.0" dy="0">Root cause 2 — No integrity / no chaining</tspan><tspan x="650.0" dy="15">blocks independent and unauthenticated</tspan></text><line x1="450.0" y1="106" x2="250.0" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><line x1="450.0" y1="106" x2="650.0" y2="148" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><rect x="30" y="258" width="190" height="66" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30" y="258" width="6" height="66" rx="3" fill="#2563eb"/><text x="125.0" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0">Vector 1</tspan></text><text x="125.0" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan x="125.0" dy="0">Pattern &amp; structure leakage</tspan></text><text x="125.0" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="500"><tspan x="125.0" dy="0">passive</tspan></text><rect x="232" y="258" width="190" height="66" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="232" y="258" width="6" height="66" rx="3" fill="#2563eb"/><text x="327.0" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="327.0" dy="0">Vector 2</tspan></text><text x="327.0" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan x="327.0" dy="0">Equality &amp; frequency inference</tspan></text><text x="327.0" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="500"><tspan x="327.0" dy="0">passive / statistical</tspan></text><rect x="434" y="258" width="180" height="66" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="434" y="258" width="6" height="66" rx="3" fill="#2563eb"/><text x="524.0" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="524.0" dy="0">Vector 3</tspan></text><text x="524.0" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan x="524.0" dy="0">Byte-at-a-time recovery</tspan></text><text x="524.0" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="500"><tspan x="524.0" dy="0">active oracle</tspan></text><rect x="640" y="258" width="230" height="66" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="640" y="258" width="6" height="66" rx="3" fill="#b45309"/><text x="755.0" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0">Vector 4</tspan></text><text x="755.0" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="400"><tspan x="755.0" dy="0">Block malleability / cut-and-paste</tspan></text><text x="755.0" y="314" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="500"><tspan x="755.0" dy="0">active splice</tspan></text><line x1="250.0" y1="208" x2="125.0" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><line x1="250.0" y1="208" x2="327.0" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><line x1="250.0" y1="208" x2="524.0" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/><line x1="650.0" y1="208" x2="755.0" y2="256" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/></svg>