# CodeQL code scanning — the source of the "scan result" security badge.
# Set `languages` to match this repo. Remove if the stack has no CodeQL support
# (then rely on dependency-review + linters + Dependabot instead).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"   # weekly, offset so it isn't on the hour

# Least privilege: read the code, write only scanning results.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]   # e.g. javascript-typescript, go, java-kotlin, ...
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
