# Keep dependencies and GitHub Actions patched. Add/adjust ecosystems to match
# the repo (npm, pip, gomod, cargo, bundler, maven, docker, ...).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]

  # Example for a Python project — change or remove to match this repo.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
