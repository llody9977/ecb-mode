      "originating_feedback": "Fresh review of commit 64b9ad6 found that both of CD-0002's approved outcomes were absent from the post-pivot source (greps for 'key wrap', 'never repeated', 'mortality' and 'hospital' returned nothing) while CD-0002 still recorded status accepted / implementation_state implemented with last_reviewed_on 2026-08-22. The CCS 2015 citation survived in Primary references with no claim on the page resting on it.",
      "decision": "Restore the boundary note as a paragraph immediately after the IND-CPA argument in docs/index.html, and replace the deleted CCS 2015 evidence-table row with an inline Vector 2 paragraph so the Primary references entry supports live content. The note states that the IND-CPA break needs at least two blocks that can repeat, that a single never-repeated full block therefore falls outside this particular break, that the boundary is inference from ECB's own determinism property and NOT a NIST carve-out, and that the modes NIST actually approves for wrapping a key are KW/KWP/TKW in SP 800-38F rather than raw ECB.",
      "rationale": "Dropping the note left the unqualified 'ECB is unsafe' claim standing against the one case its own IND-CPA argument does not reach -- the 'it's only one block, so it's fine' misconception the note existed to head off. SP 800-38F closes that loop without inventing an ECB exception. A Primary references entry supporting no on-page claim breaks the writing standard's rule that the section lists the sources establishing the page's conclusions; re-anchoring beat deleting because the CCS 2015 result is the strongest evidence that equality leakage generalises past passwords.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38A, Recommendation for Block Cipher Modes of Operation",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/a/final",
