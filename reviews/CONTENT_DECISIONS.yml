    {
      "id": "CD-0001",
      "title": "State the byte-at-a-time cost as 257 x L + <=34, not 256 x L, and reconcile it with the counter the demo prints",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html",
          "docs/diagrams/generate_diagrams.py",
          "docs/diagrams/vector3-byte-at-a-time.svg",
          "test/attacks.test.mjs",
          "test/docs-claims.test.mjs"
        ],
        "concepts": [
          "Vector 3 attack cost",
          "oracle query bound",
          "byte-at-a-time recovery",
          "executable demonstration",
          "figure and prose agreement"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24. The page stated the recovery cost as 'at most 256 x L queries' with a '12,288 worst case' for the 48-byte default, and invited the reader to check it against the counter the live demo prints. Measurement showed the implementation exceeds that bound.",
      "decision": "Restate the bound as at most 257 x L oracle queries for an L-byte secret, plus at most 34 to detect the block size and the secret length, on every surface the number appears: prose, figure alt text, the SVG summary box, and the generator. State the 48-byte default's exact cost as 4,588 queries against a 12,370 worst case, and note the count is key-independent.",
      "rationale": "recoverSecret() spends one query per position capturing the target block before it spends up to 256 probing candidates, so each position costs up to 257, not 256. detectBlockSize() and detectSecretLength() cost a further 2 x (17 - (L mod 16)) <= 34. Measured worst case (all-0xff secret, so the candidate loop never short-circuits): L=1 -> 289 (256xL bound = 256); L=8 -> 2,074 (2,048); L=16 -> 4,146 (4,096); L=48 -> 12,370 (12,288). Every case exceeds the stated bound. This is the sharpest class of documentation defect: a number the page explicitly tells the reader to verify against a demo that disproves it.",
      "authoritative_sources": [
        {
          "title": "Cryptopals Crypto Challenges, Sets 1 and 2",
          "url": "https://cryptopals.com/",
          "supports": "the byte-at-a-time recovery technique the demo implements (Set 2, Challenge 12)"
        }
      ],
      "verification_methods": [
        "node harness instrumenting the oracle callback, all-0xff secrets at L in {1,8,16,48}",
        "the in-page demo's own counter, read from the DOM in Chromium: 4,588 for the 48-byte default",
        "12 runs under independent random keys returned 4,588 every time, confirming key-independence"
      ],
      "approved_outcome": "docs/index.html states 257 x L, <=34 setup, ~129 x L average, 4,588 exact and 12,370 worst case. The alt text and the SVG summary box carry the same numbers. Two guards enforce it: test/attacks.test.mjs asserts the measured worst case sits within 257 x L + 34 and that it genuinely exceeds 256 x L, and test/docs-claims.test.mjs asserts every surface states 257 x L and no surface states 256 x L or 12,288.",
      "invalidation_conditions": [
        "recoverSecret() changes its query strategy, for example by caching the target block across positions",
        "detectBlockSize() or detectSecretLength() changes its probe sequence, altering the <=34 setup cost",
        "the page's default secret changes, invalidating the exact 4,588 figure"
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
      "id": "CD-0002",
      "title": "Demonstrate that AEAD closes Vector 4 by running the Vector 4 splice under GCM, not a single-bit flip",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html",
          "docs/js/attacks.mjs",
          "docs/js/ui.mjs",
          "docs/styles.css",
          "test/attacks.test.mjs",
          "test/docs-claims.test.mjs",
          "README.md"
        ],
        "concepts": [
          "demonstration sufficiency",
          "Vector 4 mitigation",
          "AEAD",
          "authentication tag",
          "cut-and-paste forgery"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24, argument-integrity pass. The page asserted the authentication tag 'closes Vector 4' and the demo's own verdict read 'This is what closes Vector 4' -- but the demo flipped one ciphertext bit. Vector 4 never flips a bit; it splices a whole ciphertext block.",
      "decision": "Add GcmProfileService with the same public interface as ProfileService, have each service declare its own cleartext header size, and run the identical forgeAdminToken against both via forgeUnderBothModes(). The demo shows the splice succeeding under ECB and failing tag verification under GCM, with the bit flip retained as the finer-grained case. Both halves are executed, never asserted.",
      "rationale": "A demonstration that exists to teach a contrast must show both sides of it with everything else held constant. Showing a bit flip rejected proves the tag detects alteration; it does not prove the tag defeats the specific attack the page says it defeats, and it left the reader to reconstruct the comparison from memory. Running literally the same function against two services that differ only in mode makes the mode the sole variable. Two follow-on defects were found by the pre-check-in code-review gate and folded into this decision. First, the ECB line in the GCM panel was initially a hardcoded string sitting beside three computed results — an assertion dressed as a measurement, which is the same failure this panel exists to correct. Second, the header size was initially a caller-supplied parameter defaulting to 0; a GCM caller who omitted it still got a rejected 64-byte token, so no behavioural check could distinguish a correct comparison from one demonstrating only that a mangled nonce breaks decryption.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38D, Recommendation for Block Cipher Modes of Operation: Galois/Counter Mode (GCM) and GMAC",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/d/final",
          "supports": "GCM verifies the authentication tag before returning plaintext, which is what rejects the spliced token"
        },
        {
          "title": "Cryptopals Crypto Challenges, Sets 1 and 2",
          "url": "https://cryptopals.com/",
          "supports": "the cut-and-paste profile forgery the demo reproduces (Set 2, Challenge 13)"
        }
      ],
      "verification_methods": [
        "test/attacks.test.mjs asserts one key yields role=admin under ProfileService and null under GcmProfileService for the same forge",
        "driven in Chromium: ECB splice -> role=admin; identical GCM splice -> tag failure, no plaintext returned; honest GCM token still returns role=user",
        "the ECB half is executed by forgeUnderBothModes() and asserted to equal \"admin\" in test/attacks.test.mjs, so a regression fails the suite rather than leaving a stale claim on screen",
        "the header-size footgun is guarded structurally, not behaviourally: both offsets yield a 64-byte token GCM rejects, which is exactly why the defect was invisible from outside"
      ],
      "approved_outcome": "docs/js/attacks.mjs exports GcmProfileService and forgeUnderBothModes; forgeAdminToken(service) reads the header size from service.constructor.headerSize so no call site can supply a wrong offset. The demo prints four labelled outcome lines, every one of them a value that run produced. Guards: a paired ECB/GCM assertion in test/attacks.test.mjs, plus docs-claims assertions that runGcm calls forgeUnderBothModes (matching the call, not the identifier), that the ECB line is rendered from ecbForgedRole rather than a literal, and that no caller-supplied offset parameter returns.",
      "invalidation_conditions": [
        "the token format changes so the 12-byte nonce header no longer prefixes the GCM ciphertext",
        "a demonstration is added that shows the same contrast more directly",
        "a service is added whose token layout is not expressible as a fixed cleartext header size"
      ],
      "related_decisions": [
        "CD-0004"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
      "id": "CD-0003",
      "title": "Scope the single-block note to passive exposure; ECB fails IND-CPA at any message length",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "IND-CPA",
          "single-block ECB",
          "attacker state",
          "chosen-plaintext oracle",
          "key wrapping",
          "SP 800-38F"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24. The scope note read 'Where that argument stops: it needs at least two blocks that can repeat... so this particular break does not apply to it', inside a section headed 'Why determinism breaks confidentiality'. A reader takes away that single-block ECB is IND-CPA-safe, which is false.",
      "decision": "Rewrite the note to scope the limitation to the passive distinguisher, and state explicitly that the IND-CPA break has no length limit: the CPA game gives the adversary an encryption oracle, so at one block they encrypt their candidate and compare it with the challenge, and determinism makes the two equal exactly when the guess is right. Advantage 1 again.",
      "rationale": "Deterministic encryption never achieves IND-CPA at any message length. The two-block illustration in the preceding paragraph is the simplest distinguisher that needs no oracle query, not the boundary of the break. Conflating the two is an attacker-state error: it silently promotes 'an observer sees one block' into 'the mode is secure for one block'. Egele et al. make the same point about the ECB default -- developers 'are not aware that the API default does not provide the IND-CPA strong notion of privacy'.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38A, Recommendation for Block Cipher Modes of Operation: Methods and Techniques",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/a/final",
          "supports": "section 6.1 states the equal-block property and states no length-based exception to it"
        },
        {
          "title": "NIST SP 800-38F, Recommendation for Block Cipher Modes of Operation: Methods for Key Wrapping",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/f/final",
          "supports": "the modes NIST approves for key wrapping (KW, KWP, TKW), the usual single-block case"
        },
        {
          "title": "Egele, Brumley, Fratantonio & Kruegel, An Empirical Study of Cryptographic Misuse in Android Applications (ACM CCS 2013)",
          "url": "https://dl.acm.org/doi/10.1145/2508859.2516693",
          "supports": "records that developers relying on the ECB default 'are not aware that the API default does not provide the IND-CPA strong notion of privacy'"
        }
      ],
      "verification_methods": [
        "IND-CPA game definition: the adversary holds oracle access to Enc_k before and after the challenge, so a deterministic scheme is distinguished by re-encrypting a candidate",
        "SP 800-38A section 6.1 read in full from the NIST PDF -- it states no length-based exception",
        "SP 800-38F confirmed as the recommendation defining KW, KWP and TKW for key wrapping"
      ],
      "approved_outcome": "docs/index.html carries two paragraphs: the first scopes the two-block argument to passive observation and states the oracle-based break at any length; the second keeps the SP 800-38F key-wrapping pointer and closes with the two conditions the 'only one block' claim depends on.",
      "invalidation_conditions": [
        "the IND-CPA definition used by the page changes to one without oracle access",
        "NIST publishes an explicit single-block carve-out for ECB"
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
      "id": "CD-0004",
      "title": "Do not describe bcrypt as memory-hard; cite SP 800-132 as the scheme NIST actually points to",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "password storage",
          "memory-hard",
          "bcrypt",
          "Argon2id",
          "scrypt",
          "PBKDF2",
          "SP 800-63B",
          "SP 800-132"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24. The page read 'a memory-hard scheme -- Argon2id, scrypt, or bcrypt', grouping bcrypt with two functions it does not resemble on that axis.",
      "decision": "Separate the claims. Argon2id and scrypt are deliberately expensive in memory as well as time; bcrypt remains widely deployed and acceptable but has a fixed ~4 KiB working set, making it time-hard rather than memory-hard. Add the SP 800-132 (PBKDF2) pointer that SP 800-63B-4 actually makes, and quote the standard's own normative strengths.",
      "rationale": "bcrypt's cost parameter scales iterations, not memory: its Blowfish-derived S-boxes are a fixed 4 KiB table. Calling it memory-hard misstates the property that motivates memory-hard functions in the first place -- resistance to parallel hardware. Separately, saying NIST 'names no specific algorithm' without the SP 800-132 pointer understates the guidance that exists, and the page had rendered a SHOULD-level recommendation without distinguishing it from the SHALL-level ones.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-63B-4, Digital Identity Guidelines: Authentication and Authenticator Management",
          "url": "https://pages.nist.gov/800-63-4/sp800-63b.html",
          "supports": "section 3.1.1.2: the SHALL-level salt-and-hash and 32-bit salt requirements, and the SHOULD-level cost-factor and scheme-selection clauses"
        },
        {
          "title": "NIST SP 800-132, Recommendation for Password-Based Key Derivation: Part 1: Storage Applications",
          "url": "https://csrc.nist.gov/pubs/sp/800/132/final",
          "supports": "section 5.3 approves PBKDF2, the scheme SP 800-63B-4 points to"
        }
      ],
      "verification_methods": [
        "SP 800-63B-4 section 3.1.1.2 fetched and read: 'Passwords SHALL be salted and hashed using a suitable password hashing scheme'; 'The salt SHALL be at least 32 bits in length'; 'The chosen cost factor SHOULD be as high as practical without negatively impacting verifier performance'; 'An approved password hashing scheme published in the latest revision of [SP800-132] ... SHOULD be used'",
        "SP 800-132 PDF section 5.3: 'This Recommendation approves PBKDF2 as the PBKDF using HMAC with any approved hash function as the PRF'"
      ],
      "approved_outcome": "docs/index.html quotes the SHALL clauses and the SHOULD-level cost-factor clause at their own strengths, links SP 800-132, and qualifies bcrypt explicitly. A docs-claims guard rejects any text that groups bcrypt under 'memory-hard'.",
      "invalidation_conditions": [
        "SP 800-63B or SP 800-132 is revised, changing the named schemes or the normative strengths quoted",
        "bcrypt gains a memory cost parameter"
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
      "id": "CD-0005",
      "title": "Do not claim the AEAD fix leaves Vector 2 unaddressed",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "internal contradiction",
          "Vector 2",
          "AEAD",
          "password storage",
          "GCM"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24. The Vector 2 section closed with 'The AEAD fix below addresses the other three vectors, not password storage', while the fix section said the nonce 'breaks the determinism Vectors 1-3 depend on' and the residual-risk section said 'GCM defeats all four vectors'.",
      "decision": "Rewrite the closing sentence to separate the two claims: AEAD does defeat Vector 2's ciphertext-equality clustering, and it is still the wrong design for stored passwords because an encrypted password is recoverable by whoever holds the key. The mode is the wrong lever there, not an insufficient one.",
      "rationale": "The original wording conflated 'AEAD does not solve this problem' with 'AEAD does not defeat this vector'. Only the first is true. Left as written it contradicted two other statements on the same page and would have led a reader to think GCM leaves equality inference intact.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-63B-4, Digital Identity Guidelines: Authentication and Authenticator Management",
          "url": "https://pages.nist.gov/800-63-4/sp800-63b.html",
          "supports": "password storage is a hashing problem, not an encryption-mode problem, whatever mode is chosen"
        }
      ],
      "verification_methods": [
        "read the three statements together in the current source and confirmed the contradiction",
        "the in-page CBC/GCM comparison demonstrates that a per-message nonce destroys ciphertext equality"
      ],
      "approved_outcome": "docs/index.html states that AEAD stops the clustering and is still the wrong design for stored passwords. A docs-claims guard rejects the superseded sentence and asserts 'GCM defeats all four vectors' remains.",
      "invalidation_conditions": [
        "the page's vector numbering changes"
      ],
      "related_decisions": [
        "CD-0004"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
      "id": "CD-0006",
      "title": "A repeated ciphertext block is strong evidence of determinism, not sufficient evidence of block-independence",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "ECB detection",
          "black-box test",
          "constant IV",
          "nonce reuse",
          "necessary and sufficient conditions"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24, adversarial-claims pass. The detection section read 'A repeated ciphertext block is sufficient evidence of deterministic, block-independent encryption ... but not necessary', while hedging in the same breath that ECB is 'the overwhelmingly likely cause'.",
      "decision": "Split the claim by scope. Within a single message a repeat is effectively conclusive, since a correctly-IV'd chaining mode would have to collide by chance at about 2^-128 per pair. Across a corpus of separate records it is not: CBC under a constant IV, or CTR under a reused nonce, produces the same signature without being block-independent. Cite the 1,932 constant-IV Android apps from the study the page already relies on.",
      "rationale": "The page's own Vector 2 demonstration is the corpus case -- it compares ciphertexts across records -- so the counterexample is not hypothetical for this page's own reader. Asserting sufficiency while hedging with 'overwhelmingly likely' was also internally inconsistent: a sufficient condition is not a probable one.",
      "authoritative_sources": [
        {
          "title": "Egele, Brumley, Fratantonio & Kruegel, An Empirical Study of Cryptographic Misuse in Android Applications (ACM CCS 2013)",
          "url": "https://dl.acm.org/doi/10.1145/2508859.2516693",
          "supports": "Table 2 records 1,932 apps using a constant IV, making the constant-IV CBC counterexample a documented real defect"
        }
      ],
      "verification_methods": [
        "Egele et al. Table 2 read from the author-hosted PDF: 1,932 apps 'Uses constant IV (R2)'",
        "CBC collision analysis: C_i = C_j implies P_i XOR C_(i-1) = P_j XOR C_(j-1), a chance event within one message"
      ],
      "approved_outcome": "docs/index.html states the necessary and sufficient directions separately, gives the corpus counterexample with its citation, and ends on 'strong evidence of determinism, then confirm the mode'. A docs-claims guard rejects the superseded sentence.",
      "invalidation_conditions": [
        "the detection section is rescoped to single-message analysis only"
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
      "id": "CD-0007",
      "title": "The modes figure must name the IV; 'XORs with the previous ciphertext' is wrong for the first block it draws",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/diagrams/generate_diagrams.py",
          "docs/diagrams/modes-ecb-cbc-gcm.svg",
          "docs/index.html"
        ],
        "concepts": [
          "visual content correctness",
          "detached-artifact test",
          "CBC",
          "initialization vector",
          "alt text"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24, visual-content pass. The CBC row read 'XORs each block with the previous ciphertext first, so identical blocks enter AES differently'. The figure draws P1 and P2; P1 has no previous ciphertext. The figure named the IV nowhere at all.",
      "decision": "Correct the CBC caption to name the IV and its per-message freshness, extend all three captions to three lines for balance, and add a footer qualifier stating that CBC and GCM avoid the repeat only while the IV or nonce is fresh. Carry the same correction into the figure's alt text and the prose paragraph above it.",
      "rationale": "A figure detaches from its page far more readily than prose does. Read alone the old figure taught that CBC's protection comes from chaining, when across messages it comes entirely from a fresh IV -- and it was simply wrong about the first block, which is one of the two blocks drawn. The qualifier has to live inside the figure, not in the surrounding text that does not travel with it.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38A, Recommendation for Block Cipher Modes of Operation: Methods and Techniques",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/a/final",
          "supports": "section 6.2: 'The CBC mode requires an IV to combine with the first plaintext block'"
        }
      ],
      "verification_methods": [
        "SP 800-38A section 6.2 read from the NIST PDF: 'The CBC mode requires an IV to combine with the first plaintext block'",
        "regenerated the SVG and inspected it in Chromium in both prefers-color-scheme settings; no clipping or overflow at the new three-line height"
      ],
      "approved_outcome": "The generator emits a three-line CBC caption naming the fresh random IV per message, plus a footer qualifier. The alt text and the prose carry the same content. A docs-claims guard asserts both strings are present in the generator and in the committed SVG.",
      "invalidation_conditions": [
        "the figure is redrawn with a different set of modes or a different layout"
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-24",
      "last_reviewed_on": "2026-08-24"
    },
    {
