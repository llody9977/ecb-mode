      "originating_feedback": "A fresh whole-project review (2026-08-21) checked every standards-sensitive and time-sensitive claim touched by an in-progress uncommitted diff against current primary sources, per the doc-review skill's mandatory 'Verify evidence' pass.",
      "decision": "Two claims were corrected. (1) The scope note previously asserted 'NIST approves ECB for a narrow case: a single block of unpredictable data, such as key wrapping' -- this is now stated as an author-derived logical consequence of ECB's determinism property (no second ciphertext block exists to leak an equality comparison through), with an explicit note that SP 800-38A itself does not carve out this exception. (2) The CCS 2015 real-world evidence row previously read 'recovered patient mortality risk for at least 99% of the 200 largest hospitals' -- now reads '100% of patients in at least 99% of the 200 largest hospitals', restoring the patient-percentage qualifier the paper actually states.",
      "rationale": "NIST SP 800-38A Section 6.1 (legacy PDF) states only: 'under a given key, any given plaintext block always gets encrypted to the same ciphertext block. If this property is undesirable in a particular application, the ECB mode should not be used' -- zero occurrences of 'key wrap' or 'single block' anywhere, so the prior key-wrapping-exception claim was unsupported. Corroborated by NIST's 2022 proposal to revise SP 800-38A, which would 'limit the approval of ECB to instances that are specifically allowed by other NIST standards or guidance' -- confirming that restriction doesn't exist in the current standard yet. Naveed/Kamara/Wright CCS 2015 (author PDF) states: 'It recovered Mortality Risk and whether the patient died for 100% of the patients for 99% and 100% of the hospitals respectively' -- confirming the corrected wording and superseding CD-0001's imprecise figure.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38A, Recommendation for Block Cipher Modes of Operation (legacy PDF, Section 6.1)",
          "url": "https://nvlpubs.nist.gov/nistpubs/legacy/sp/nistspecialpublication800-38a.pdf",
          "supports": "ECB's definition and determinism property carry no stated single-block/key-wrapping exception"
        },
        {
          "title": "NIST, Proposal to Revise SP 800-38A",
          "url": "https://csrc.nist.gov/news/2022/proposal-to-revise-sp-800-38a",
          "supports": "corroborates that the current standard does not yet restrict ECB approval to specific allowed instances -- that restriction is proposed, not existing"
        },
        {
          "title": "Naveed, Kamara & Wright, Inference Attacks on Property-Preserving Encrypted Databases, ACM CCS 2015 (author PDF)",
          "url": "https://cs.brown.edu/people/seny/pubs/edb.pdf",
          "supports": "exact mortality-risk recovery statistic: 100% of patients, 99% of the 200 largest hospitals"
        }
      ],
      "verification_methods": [
        "Fetched the NIST SP 800-38A legacy PDF, grepped for 'key wrap' and 'single block' -- zero matches.",
        "Fetched NIST's 2022 proposal-to-revise page -- confirms the restriction is a future change, not current text.",
        "Fetched the Naveed/Kamara/Wright CCS 2015 paper PDF directly and located the Section 9.1 results sentence verbatim, not a secondary summary."
