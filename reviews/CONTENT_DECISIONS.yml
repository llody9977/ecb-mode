      "approved_outcome": "docs/ecb-mode-unsafe.md's scope note attributes the single-block/never-repeated exception to logical inference from ECB's own determinism property, not to NIST, and explicitly states SP 800-38A does not carve it out; the CCS 2015 real-world evidence row states the mortality-risk figure as '100% of patients in at least 99% of the 200 largest hospitals', matching the paper's own wording.",
