      "rationale": "The DOIs are correct and resolve for a human reader; only automated fetching is blocked, which is an access limitation of the review method rather than a defect in the citation. Both papers' figures were cross-checked against multiple independent accounts that agree exactly, including the 5,656/2,000 sub-split, and the page states each claim at the strength those accounts support. Swapping the DOI for a mirror would trade a canonical, stable identifier for a copy whose fidelity cannot be established -- a worse citation, not a better one.",
