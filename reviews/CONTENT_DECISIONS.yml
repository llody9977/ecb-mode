    {
      "id": "CD-0013",
      "title": "State GCM's 2^32 invocation ceiling without modelling whether a deployment reaches it",
      "status": "rejected",
      "implementation_state": "not_applicable",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "GCM residual risk",
          "operational limits",
          "page scope boundary",
          "optional extension"
        ]
      },
      "originating_feedback": "The residual-risk section states SP 800-38D section 8.3's 2^32 per-key invocation cap for the RBG-based construction but gives no guidance on the message rates or key lifetimes at which a deployment would approach it. A later reviewer may raise the absent capacity guidance as a coverage gap.",
      "decision": "State the ceiling and what it applies to; do not add throughput modelling, rekey-interval arithmetic, or worked capacity examples. Classify any such proposal as an optional extension, never a required gap.",
      "rationale": "The page's subject is why ECB fails and what to use instead. The ceiling belongs because a reader choosing the random-nonce construction must know it is bounded; the arithmetic of a particular deployment does not, because it depends on message rate, key lifetime and rotation policy that the page has no basis to assume. Inventing illustrative rates would produce exactly the unsourced numerical example the writing standard prohibits. The page already says the limit is something a rekey schedule must account for, which points the reader at the decision without pretending to make it for them.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38D, Recommendation for Block Cipher Modes of Operation: GCM and GMAC",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/d/final",
          "supports": "section 8.3 caps total invocations at 2^32 per key unless only 96-bit deterministic IVs are used -- the limit is stated as a global requirement, with no per-deployment guidance NIST supplies either"
        }
      ],
      "verification_methods": [
        "Read SP 800-38D section 8.3 directly and confirmed NIST itself states the cap as a global requirement without deployment-rate guidance, so the page is not omitting something its cited source provides."
      ],
      "approved_outcome": "docs/index.html's residual-risk section names the 2^32 ceiling, says which construction it binds, and notes a rekey schedule must account for it. No throughput or capacity figures appear.",
      "invalidation_conditions": [
        "The page broadens into deployment or key-management guidance, which would make capacity arithmetic in scope.",
        "NIST publishes deployment-rate guidance for the ceiling that the page could cite rather than invent."
      ],
      "related_decisions": [
        "CD-0007"
      ],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-22",
      "last_reviewed_on": "2026-08-22"
    }
