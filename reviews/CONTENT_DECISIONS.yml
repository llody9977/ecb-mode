      "originating_feedback": "Fresh review of commit 64b9ad6 found 'roughly 256 x L queries' stated in three places -- prose, figure alt text and the figure's own summary box -- with L never defined anywhere, and with the figure presenting a worst-case bound as a typical cost. Measured runs contradicted it directly.",
      "decision": "State the cost as an explicit bound: at most 256 x L queries for an L-byte secret, about 128 x L on average because the candidate search stops at the match, and lower still for printable ASCII. Bind L to 'an L-byte secret' at every occurrence including inside the SVG, and quote the measured figure for the page's own default secret so prose and demo agree.",
      "rationale": "The page tells the reader to run the demo and the demo prints its query count, so an unreconciled worst-case figure is contradicted on screen. Five runs against the 48-byte default secret averaged 4,588 queries against a stated 256 x L of 12,288 -- a factor of 2.7. An undefined symbol inside a figure also fails the detached-artifact test, since the figure's headline number becomes unreadable once it leaves the page.",
      "authoritative_sources": [],
