        {
          "title": "NIST SP 800-38F, Methods for Key Wrapping",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/f/final",
          "supports": "KW, KWP and TKW are the approved key-wrapping modes, final since December 2012 -- the answer to 'can I just ECB one block' is a dedicated mode, not ECB"
        },
        {
          "title": "Naveed, Kamara & Wright, Inference Attacks on Property-Preserving Encrypted Databases, ACM CCS 2015",
          "url": "https://dl.acm.org/doi/10.1145/2810103.2813651",
          "supports": "frequency analysis against deterministically encrypted columns recovers plaintext attributes using publicly available auxiliary data, evaluated on the HCUP National Inpatient Sample"
        }
