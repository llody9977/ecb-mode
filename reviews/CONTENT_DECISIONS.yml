          "attack-visual defensibility"
        ]
      },
      "originating_feedback": "User asked whether the doc standards encourage purposeful (non-decorative) visuals, and whether doc-review holds content inside images to the same accuracy standard as prose; then instructed to close any gaps in the skills/rules and run doc-review to find image-representation applicability in ecb-mode. The scoped pass flagged Vectors 3 and 4 as required visual gaps and the existing PNG as not self-sufficient when detached.",
      "decision": "Added four ```mermaid diagrams to docs/ecb-mode-unsafe.md, all rendered live (searchable source, native GitHub rendering) rather than as binary images: (1) a three-mode block-flow diagram in 'The mechanism' showing why only ECB's equal-in/equal-out path leaks; (2) a taxonomy tree in 'Comprehensive attack surface' fixing determinism -> Vectors 1-3 and no-integrity -> Vector 4, with no third root cause; (3) a REQUIRED byte-at-a-time block-alignment diagram in Vector 3; (4) a REQUIRED cut-and-paste block-splice diagram in Vector 4. Each attack diagram carries an inline scope line naming the local demonstration target. Regenerated notebooks/ecb_pattern_leakage.png from its notebook generator with a baked-in suptitle stating 'same 192x192 bitmap, same AES-128 key - only the mode differs', so the figure states its own comparison axis when detached. Rewrote the figure alt text in README.md and docs to carry the conclusion (only ECB preserves structure) rather than merely naming the four panels.",
      "rationale": "Vectors 3 and 4 are block-alignment mechanics that dense prose forces the reader to simulate mentally; a block-layout diagram is the form that materially improves comprehension, so they were classified required gaps, not optional enrichment. Mermaid was chosen over inline SVG because GitHub sanitizes raw <svg> out of markdown (it would not render where these docs live), while Mermaid renders natively and keeps every label as searchable source text. The diagrams depict exactly what the tested code does: Vector 3's filler counts (15 for byte 0, 14 for byte 1) match oracle_attack.recover_secret's pad_len = (-byte_index-1) % 16; Vector 4's block contents (email=xxxxxxxxxx | admin+padding ; email=aaaaaaaaaa | a&uid=1000&role= | user+padding) match cut_and_paste.forge_admin_token byte for byte. The PNG qualifier was baked into the image itself, not left only in the caption, so the detached-artifact requirement is met even if the file is grabbed alone.",
      "authoritative_sources": [
        {
          "title": "GitHub: creating diagrams with Mermaid in Markdown",
          "url": "https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/creating-diagrams",
          "supports": "GitHub renders fenced mermaid code blocks natively, and sanitizes raw inline <svg> out of Markdown -- the reason the diagrams are Mermaid, not inline SVG"
        },
        {
          "title": "Mermaid flowchart syntax reference",
          "url": "https://mermaid.js.org/syntax/flowchart.html",
          "supports": "flowchart subgraph, classDef, and dashed-link syntax used by all four diagrams; verified to parse and render error-free"
        }
      ],
      "verification_methods": [
        "Read oracle_attack.py and cut_and_paste.py and derived the exact block byte layouts by hand; diagram labels match (byte-0 filler 15, byte-1 filler 14; base email_len 11 aligns role= to a block boundary; donor admin block is split_blocks(donor_token)[1]).",
        "Rendered all four diagrams in a real Mermaid engine (mermaid.min.js) via the in-app browser: 4 pre.mermaid blocks produced 4 SVGs, 0 error/syntax nodes; diagrams 1-2 confirmed visually with correct color coding, diagrams 3-4 confirmed by extracting rendered node labels and edge labels from the SVG DOM.",
        "Regenerated the PNG by executing the notebook headlessly (python3 -m nbconvert --execute --inplace); confirmed the figure now shows the same-key/AES-128 suptitle and that no stray PNG was written to the repo root.",
        "Ran pytest (22/22 passed) after the notebook re-execution to confirm the src implementations the diagrams depict are unchanged and green.",
        "Diagram-to-code provenance rests on the in-repo generators, not external URLs: src/ecb_lab/oracle_attack.py (Vector 3) and src/ecb_lab/cut_and_paste.py (Vector 4) are the durable provenance for the block mechanics; notebooks/ecb_mode_deep_dive.ipynb cell 3 is the generator for the PNG."
      ],
      "approved_outcome": "docs/ecb-mode-unsafe.md carries four live Mermaid diagrams whose relationships (determinism -> V1-3, no-integrity -> V4; the ECB-only leakage path; the V3 alignment loop; the V4 splice) are the deliberate, code-accurate structure. The pattern-leakage PNG states its own comparison axis internally. Figure alt text in both README.md and docs states the conclusion, not just the panel names.",
      "invalidation_conditions": [
        "The tested implementations change the block mechanics a diagram depicts (e.g. oracle_attack's alignment formula or cut_and_paste's field layout), at which point the corresponding diagram must be re-derived and re-verified against the new code, not merely left in place.",
        "GitHub changes whether it renders fenced mermaid blocks, which would require re-choosing the diagram medium (e.g. rendered SVG/PNG committed with its generator).",
        "A future reviewer establishes that one of the diagrams overstates or misstates what the code proves, under the same cross-format accuracy rule that applies to prose."
      ],
      "related_decisions": [
        "CD-0001",
        "CD-0004"
      ],
      "supersedes": [],
