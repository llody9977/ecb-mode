    {
      "id": "CD-0006",
      "title": "Refine the two-root-cause boundary: determinism carries position-independence, root cause 2 is authentication only, and Vector 4 depends on both",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html",
          "README.md",
          "docs/diagrams/generate_diagrams.py",
          "docs/diagrams/taxonomy.svg"
        ],
        "concepts": [
          "ECB attack taxonomy",
          "ECB threat vector structure",
          "root cause boundary",
          "document structure",
          "diagram-prose consistency"
        ]
      },
      "originating_feedback": "Fresh review of commit 64b9ad6 found five statements of the same taxonomy claim disagreeing: taxonomy.svg's subtitle said 'one or both root causes' while its own arrows drew exactly one cause per vector; docs/index.html prose and the figure alt text said strictly one; the closing callout said 'one or both'. The review also found that 'no chaining' was doing work inside both root causes, so the two were not the disjoint partition the figure implied.",
      "decision": "Keep the 2-root-cause / 4-vector taxonomy from CD-0001 and move the block-independence property entirely into root cause 1. Root cause 1 is now 'Determinism -- same plaintext block gives the same ciphertext block, at any position, in any message'. Root cause 2 narrows from 'No integrity / no chaining' to 'No authentication -- nothing detects a ciphertext that was altered or reassembled'. The taxonomy gains a dashed arrow from root cause 1 to Vector 4, labelled 'Vector 4 needs determinism too', so the drawn relationships match the 'one or both' subtitle. Prose, alt text and the closing callout all adopt the same formulation.",
      "rationale": "Cut-and-paste needs both properties and the old split hid that: the spliced block decrypts to role=admin at its new position only because ECB's codebook map is position-independent (root cause 1), and it survives only because nothing authenticates the result (root cause 2). Putting 'no chaining' in root cause 2 while root cause 1 already asserted position-independent determinism made the two causes overlap, and left the figure asserting a stricter claim in its arrows than in its own subtitle. This refines the boundary inside CD-0001's taxonomy rather than meeting its invalidation condition -- no third root cause was identified and the four vectors are unchanged.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38A, Recommendation for Block Cipher Modes of Operation",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/a/final",
          "supports": "section 6.1's statement of ECB determinism, which is position-independent as written and so already implies block independence"
        }
      ],
      "verification_methods": [
