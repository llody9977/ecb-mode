      "originating_feedback": "A fresh whole-project review (2026-08-22) after the project pivoted to an interactive GitHub Pages site (commit 2bb02b6, which deleted docs/ecb-mode-unsafe.md, src/ecb_lab/, and notebooks/) found that CD-0003's Mermaid decision had been reversed by commit 9a1aea5 ('Replace Mermaid diagrams with hand-authored SVG figures') without a superseding record, and that the decision register's validator was failing on CD-0001/CD-0002/CD-0003 scope files the pivot had deleted.",
      "decision": "Supersede CD-0003. The four diagrams are now hand-authored, theme-aware SVG produced by a committed generator (docs/diagrams/generate_diagrams.py) and embedded as <img> in docs/index.html, replacing the four ```mermaid blocks. CD-0003 chose Mermaid specifically because GitHub sanitizes raw inline SVG out of Markdown; that constraint no longer applies, because the content is no longer GitHub-rendered Markdown — it is a standalone HTML site served by GitHub Pages, where committed SVG renders natively in every browser and keeps every label as searchable source text. This meets CD-0003's own recorded invalidation condition (GitHub markdown rendering ceasing to be the medium, requiring the diagram medium to be re-chosen as SVG committed with its generator). The self-sufficiency, code-accuracy, and attack-visual defensibility requirements CD-0003 established are retained and re-verified against the new SVGs; each attack diagram carries an inline scope line naming its local demonstration target in the current JS code (attacks.mjs makeSuffixOracle for Vector 3, ProfileService for Vector 4).",
      "rationale": "The pivot changed the delivery medium from a GitHub-rendered Markdown document to a standalone HTML site, which voids Mermaid's sole advantage in CD-0003 (surviving GitHub Markdown sanitization) while committed SVG gains full layout control, theme-awareness via a prefers-color-scheme override baked into each file, and deterministic generator-to-artifact provenance. Re-running docs/diagrams/generate_diagrams.py reproduces all four committed SVGs byte-for-byte, so artifact-to-source correspondence is verifiable and stronger than a live-rendered Mermaid block. The V3 and V4 block layouts continue to match the tested code exactly: V3's filler counts (15 for byte 0, 14 for byte 1) match recoverSecret's padLen = ((-i-1) % 16 + 16) % 16, and V4's block contents match forgeAdminToken (donor block 1 = 'admin'+padding; base email_len 11 aligns 'role=' to a block boundary).",
      "authoritative_sources": [
        {
          "title": "MDN Web Docs — SVG: Scalable Vector Graphics",
          "url": "https://developer.mozilla.org/en-US/docs/Web/SVG",
          "supports": "browsers render SVG natively in HTML, so a standalone HTML site can embed committed SVG directly — the Markdown-sanitization constraint that forced CD-0003 to choose Mermaid no longer applies"
        },
        {
          "title": "GitHub Docs — What is GitHub Pages?",
          "url": "https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages",
          "supports": "the write-up is now served as a static HTML site by GitHub Pages, the delivery context that removed the GitHub-Markdown rendering constraint behind CD-0003"
        }
      ],
      "verification_methods": [
        "Re-ran docs/diagrams/generate_diagrams.py and diffed all four outputs against the committed SVGs — byte-for-byte identical, establishing generator-to-artifact provenance.",
        "Served docs/ over a local HTTP server and loaded index.html in a browser: all four SVG figures display correctly in dark theme with zero console errors; the image, forge, and GCM demos run live against real Web Crypto AES and produce their claimed results.",
        "Confirmed node --test passes 9/9 (incl. the NIST SP 800-38A F.1.1 AES-128-ECB vectors) so the tested code the V3/V4 diagrams depict is unchanged and green, and grepped docs/ to confirm no stale ecb_lab module reference remains inside any SVG."
      ],
      "approved_outcome": "docs/index.html embeds four committed theme-aware SVG figures (modes-ecb-cbc-gcm, taxonomy, vector3-byte-at-a-time, vector4-cut-and-paste) generated by docs/diagrams/generate_diagrams.py; each attack diagram carries its own inline scope line naming the local demonstration target in current JS code, and each figure states its own comparison axis when detached. CD-0003 is preserved as superseded history rather than deleted or rewritten.",
      "invalidation_conditions": [
