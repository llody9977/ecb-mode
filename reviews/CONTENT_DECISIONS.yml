      "decision": "Added four ```mermaid diagrams to docs/ecb-mode-unsafe.md, all rendered live (searchable source, native GitHub rendering) rather than as binary images: (1) a three-mode block-flow diagram in 'The mechanism' showing why only ECB's equal-in/equal-out path leaks; (2) a taxonomy tree in 'Comprehensive attack surface' fixing determinism -> Vectors 1-3 and no-integrity -> Vector 4, with no third root cause; (3) a REQUIRED byte-at-a-time block-alignment diagram in Vector 3; (4) a REQUIRED cut-and-paste block-splice diagram in Vector 4. Each attack diagram carries an inline scope line naming the local demonstration target. Regenerated notebooks/ecb_pattern_leakage.png from its notebook generator with a baked-in suptitle stating 'same 192x192 bitmap, same AES-128 key - only the mode differs', so the figure states its own comparison axis when detached. Rewrote the figure alt text in README.md and docs to carry the conclusion (only ECB preserves structure) rather than merely naming the four panels.",
