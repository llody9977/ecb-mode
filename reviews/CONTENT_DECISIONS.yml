      "originating_feedback": "Fresh review of commit 64b9ad6 found that the page's scope callout promises 'Every weakness is paired with its mitigation', that Vector 2's exemplar is Adobe's password store, and that the page flags 'encrypted (not hashed)' twice -- the only two occurrences of 'hash' on the page -- without ever stating the correct control. A reader following the page's own structure lands on 'The fix -- authenticated encryption'.",
      "decision": "Add a paragraph directly after the Vector 2 demo stating that the fix for this vector is not a cipher mode: AES-GCM would have stopped the clustering and still been the wrong design, because an encrypted password is recoverable by anyone holding the key. Cite NIST SP 800-63B-4 section 3.1.1.2 for the salted-hashing requirement, name memory-hard schemes as established practice rather than as NIST-named algorithms, and say explicitly that the AEAD fix below covers the other three vectors.",
      "rationale": "Leaving the gap open let the page's structure imply a wrong answer for the one vector whose real-world exemplar is password storage. Keeping the note short and adjacent to Vector 2 preserves the page's ECB scope without turning it into a credential-storage guide. The distinction between what SP 800-63B requires (salted hashing with a suitable scheme) and what practice recommends (Argon2id, scrypt, bcrypt) is stated explicitly so the author's recommendation is not read as a NIST requirement.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-63B-4, Digital Identity Guidelines: Authentication and Authenticator Management",
          "url": "https://pages.nist.gov/800-63-4/sp800-63b.html",
          "supports": "section 3.1.1.2 requires that passwords 'SHALL be salted and hashed using a suitable password hashing scheme', with a salt of at least 32 bits; it does not name Argon2id, scrypt or bcrypt in that section"
        },
        {
          "title": "filippo.io, Analyzing the Adobe leaked passwords",
          "url": "https://filippo.io/analyzing-the-adobe-leaked-passwords/",
          "supports": "the Adobe store was encrypted with an 8-byte block cipher in ECB mode and unsalted -- 'It is a block cipher: this is a complete misuse. Hashing, password strengthening and encryption are different things.'"
        }
      ],
      "verification_methods": [
        "Read SP 800-63B-4 at its NIST-hosted HTML source, confirmed the revision (Revision 4, published 2025-08-26) and the section number before quoting the SHALL sentence.",
        "Grepped the page for hash/salt/KDF terms before editing: the only two matches were the 'encrypted (not hashed)' asides themselves, confirming the gap was real rather than covered elsewhere."
      ],
      "approved_outcome": "docs/index.html carries a paragraph immediately after the Vector 2 equality-inference demo, opening 'The fix for this one is not a better cipher mode', quoting the SP 800-63B-4 section 3.1.1.2 SHALL requirement with its 32-bit salt minimum, naming Argon2id/scrypt/bcrypt as established practice explicitly distinguished from NIST's wording, and stating that the AEAD fix addresses the other three vectors. The closing callout repeats the boundary in one clause.",
      "invalidation_conditions": [
        "A later revision of SP 800-63B changes the password-storage requirement or its section numbering.",
        "The page drops the Adobe exemplar from Vector 2, which would remove the reason for the note."
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-22",
      "last_reviewed_on": "2026-08-22"
    },
