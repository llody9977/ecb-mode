    {
      "id": "CD-0007",
      "title": "State GCM's IV requirement as uniqueness, not randomness, and carry the 2^32 invocation limit that applies to the RBG-based construction",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "GCM nonce",
          "IV uniqueness",
          "residual risk",
          "SP 800-38D",
          "nonce reuse",
          "AEAD guidance"
        ]
      },
      "originating_feedback": "Fresh review of commit 64b9ad6 found the residual-risk section asserting 'A fresh random 96-bit nonce per message is necessary', which contradicts SP 800-38D, and omitting the invocation ceiling NIST attaches to exactly the construction the page was recommending.",
      "decision": "Rewrite the residual-risk section to state the requirement as SP 800-38D states it -- a probability bound on ever reusing an (IV, key) pair -- then present both approved constructions (deterministic, section 8.2.1; RBG-based, section 8.2.2) and the section 8.3 cap of 2^32 invocations per key that applies to everything except 96-bit deterministic IVs. Apply the same correction to the CBC/CTR fallback sentence, where CTR needs a counter block that is never reused rather than a 'fresh random IV'.",
      "rationale": "Randomness is one of two approved paths to uniqueness, and it is the one that carries a hard operational ceiling; calling it 'necessary' both overstates the standard and steers readers away from the only construction NIST leaves uncapped. A page whose section heading is 'Residual risk after switching to GCM' has to carry the residual risk that NIST actually quantifies.",
      "authoritative_sources": [
        {
          "title": "NIST SP 800-38D, Recommendation for Block Cipher Modes of Operation: GCM and GMAC",
          "url": "https://csrc.nist.gov/pubs/sp/800/38/d/final",
          "supports": "Section 8 states the requirement as 'The probability that the authenticated encryption function ever will be invoked with the same IV and the same key on two (or more) distinct sets of input data shall be no greater than 2-32'; section 8.2 gives the deterministic and RBG-based constructions; section 8.3 caps total invocations at 2^32 per key unless only 96-bit deterministic IVs are used"
        },
        {
          "title": "Bock, Zauner, Devlin, Somorovsky & Jovanovic, Nonce-Disrespecting Adversaries, USENIX WOOT 2016",
          "url": "https://eprint.iacr.org/2016/475",
          "supports": "'With an Internet-wide scan we identified 184 HTTPS servers repeating nonces, which fully breaks the authenticity of the connections' -- the failure is authenticity of the affected connections, not a general confidentiality break"
        }
      ],
      "verification_methods": [
        "Extracted the SP 800-38D PDF text via the macOS Spotlight importer and read sections 8, 8.2, 8.2.1, 8.2.2 and 8.3 directly rather than relying on secondary summaries.",
        "Extracted the Bock et al. PDF and confirmed the 184-server figure and the authenticity scope verbatim from the abstract and section 5."
      ],
      "approved_outcome": "docs/index.html's 'Residual risk after switching to GCM' section quotes the section 8 uniqueness bound, lists the deterministic and RBG-based constructions as a two-item list noting that 96-bit deterministic IVs are the only uncapped choice, and states the 2^32 section 8.3 ceiling as an operational limit that rekey scheduling must account for. SP 800-38D is listed in Primary references with the relevant section numbers. The CBC/CTR fallback sentence says 'a counter block that is never reused under the same key' for CTR.",
      "invalidation_conditions": [
        "A revision of SP 800-38D changes the uniqueness bound, the approved constructions, or the 2^32 invocation limit.",
        "The page stops recommending GCM as the primary fix, which would move where this guidance belongs."
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-22",
      "last_reviewed_on": "2026-08-22"
    },
