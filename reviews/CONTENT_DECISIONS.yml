    {
      "id": "CD-0009",
      "title": "Give the Adobe row exact figures and its own citation; drop the unsourced 'within hours'",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "Adobe 2013",
          "real-world evidence",
          "citation placement",
          "illustrative figures"
        ]
      },
      "originating_feedback": "Clean doc-review of 2026-08-24, evidence-authority pass. The Adobe row said researchers confirmed the common values 'within hours' -- a timing claim neither cited source states -- and it was the only row in the evidence table with no inline link.",
      "decision": "Replace '~153M' with the exact 152,982,479, quote the source's own hedge on the cipher ('allegedly 3DES'), drop the timing claim, add the 8-byte-block partial-password leak the source documents, and link filippo.io inline.",
      "rationale": "The timing claim added nothing and was the one figure in the row no source supported. The 8-byte-block consequence is materially more interesting than the timing and is directly attested: sharing any 8-character block with another user leaked that portion of the password, which is the Vector 2 mechanism at sub-password granularity.",
      "authoritative_sources": [
        {
          "title": "Filippo Valsorda, Analyzing the Adobe leaked passwords",
          "url": "https://filippo.io/analyzing-the-adobe-leaked-passwords/",
          "supports": "152,982,479 entries; 8-byte block cipher 'allegedly 3DES' in ECB; unsalted; the 8-character-block partial leak"
        },
        {
          "title": "Bruce Schneier, Cryptographic Blunders Revealed by Adobe's Password Leak",
          "url": "https://www.schneier.com/blog/archives/2013/11/cryptographic_b.html",
          "supports": "contemporaneous analysis of the same breach"
        }
      ],
      "verification_methods": [
        "filippo.io fetched and read: '152,982,479 entries'; 'The passwords seem to be encrypted with a 8-bytes block cipher, allegedly 3DES, in ECB mode'; 'It is not salted'; 'anyone with a 8-characters block in common with you will now (all or a portion of) your password'"
      ],
      "approved_outcome": "The Adobe row carries the exact record count, the hedged cipher attribution, the partial-block leak, and an inline filippo.io link. The Vector 2 prose uses the same exact figure.",
      "invalidation_conditions": [
        "a better-sourced analysis revises the record count or the cipher attribution"
      ],
      "related_decisions": [],
