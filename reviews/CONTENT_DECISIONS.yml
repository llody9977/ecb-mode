        "Instrumented recoverSecret() with a counting oracle wrapper and ran the page's default 48-byte secret five times under Node: mean 4,588 queries, against 256 x L = 12,288 and 128 x L = 6,144.",
        "After the edit, re-ran the in-browser demo (on-screen verdict: 4,588 oracle queries, matching the figure quoted in the prose) and regenerated vector3-byte-at-a-time.svg to confirm the summary box defines L inline."
      ],
      "approved_outcome": "docs/index.html's Vector 3 paragraph states the at-most, average and ASCII cases with L bound to 'a secret of L bytes' and quotes roughly 4,600 queries against a 12,288 worst case for the default; the figure alt text states both the 256 x L bound and the 128 x L average with L defined; the SVG summary box reads 'at most 256 x L oracle queries for an L-byte secret -- about 128 x L on average'.",
      "invalidation_conditions": [
        "recoverSecret()'s candidate search changes order or short-circuits differently, which would move the measured average.",
        "The page's default secret changes, which would invalidate the quoted 4,600 / 12,288 pair."
      ],
