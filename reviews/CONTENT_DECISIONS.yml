    {
      "id": "CD-0010",
      "title": "Attribute the ECB default in Cipher.getInstance(\"AES\") to the JCA provider, not to the JCA itself",
      "status": "accepted",
      "implementation_state": "implemented",
      "scope": {
        "files": [
          "docs/index.html"
        ],
        "concepts": [
          "white-box detection",
          "Java Cryptography Architecture",
          "provider defaults",
          "standards attribution",
          "library default footgun"
        ]
      },
      "originating_feedback": "Fresh review of commit 64b9ad6 found the white-box detection bullet stating that 'the Java Cryptography Architecture silently resolves' an unqualified transformation to AES/ECB/PKCS5Padding, presented as the page's highest-yield single check.",
      "decision": "Attribute the default to the provider. Quote Oracle's JCA reference guide on SunJCE and SunPKCS11 defaulting to ECB and PKCS5Padding, note that the BouncyCastle provider behind the Android findings in the evidence table did the same, and state that the JCA itself defines no default -- which is the actual reason the call is easy to miss in review.",
      "rationale": "The JCA specifies that an unqualified transformation takes a provider-specific default; it does not mandate ECB. Getting this wrong in the one bullet the page calls its highest-yield check would send a reader looking for a guarantee that does not exist, and it sits two rows above a study whose ECB defaults came from a different provider entirely. The corrected wording is also the stronger teaching point: the danger is that the answer depends on the provider.",
      "authoritative_sources": [
        {
          "title": "Oracle, Java Cryptography Architecture (JCA) Reference Guide",
          "url": "https://docs.oracle.com/en/java/javase/21/security/java-cryptography-architecture-jca-reference-guide.html",
          "supports": "'By not doing so, the provider will use a default. For example, the SunJCE and SunPKCS11 providers use ECB as the default mode, and PKCS5Padding as the default padding for many symmetric ciphers.'"
        },
        {
          "title": "Egele, Brumley, Fratantonio & Kruegel, An Empirical Study of Cryptographic Misuse in Android Applications, ACM CCS 2013",
          "url": "https://dl.acm.org/doi/10.1145/2508859.2516693",
          "supports": "of 11,748 apps using crypto APIs, 7,656 violated the do-not-use-ECB rule, 5,656 of them because the developer named only a block cipher and the BouncyCastle provider configured ECB"
        }
      ],
      "verification_methods": [
        "Read Oracle's JCA reference guide for JDK 21 and quoted the provider-default sentence rather than paraphrasing it.",
        "Confirmed that the Egele et al. default-ECB result is attributed to the BouncyCastle provider on Android, a different provider from the SunJCE example, and worded the bullet so both are named."
      ],
      "approved_outcome": "docs/index.html's white-box detection bullet quotes the JCA reference guide on SunJCE and SunPKCS11 defaults, names BouncyCastle as the provider behind the Android findings, states that the JCA defines no default, and links the guide inline.",
      "invalidation_conditions": [
        "A JDK release changes the SunJCE default mode or the JCA begins specifying a default.",
        "The Android findings row is removed from the evidence table, which would drop the BouncyCastle half of the bullet."
      ],
      "related_decisions": [],
      "supersedes": [],
      "superseded_by": null,
      "originated_on": "2026-08-22",
      "last_reviewed_on": "2026-08-22"
