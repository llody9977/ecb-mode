[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# scripts/ is bootstrapped verbatim from the doc-review skill (don't fork it here);
# notebooks/ is a teaching artifact. Lint the project's own library + tests.
extend-exclude = ["notebooks", "scripts", "docs/diagrams"]

[tool.ruff.lint]
# ruff's default rule set (E4/E7/E9 + pyflakes) plus import sorting
select = ["E4", "E7", "E9", "F", "I"]
